ソーダアイス
</b></font></td></tr></table>
<table width=340 border=0 cellpadding=8><tr><td><font size=2>
スタンダードな駄菓子の一つで、ソーダ味の水色のシャーベットに２本バーが刺さっているタイプ。縦に２つに割って食べることができる。<br><br>
ちなみにこのアイスは当たりつきで、２本のバーのうち一方に「アタリ」が出たらもう一本もらえることになっている。結構根強い人気があるようで、主人公が子供の頃から変わらぬ味を保っている。<br>
