</b></font></td></tr></table>
<table width=340 border=0 cellpadding=8><tr><td><font size=2>
主人公の祖父。<br>
父親が生まれる前に、太平洋戦争に出征して戦死する。<br><br>
どちらかというと、見栄や外見を気にするタイプらしく、そのせいか女性に関してもやたらキザ。彼の書いた妻（泰江）へのラブレターは赤面モノ。<br><br>
ちなみに、彼の父親は戦争に批判的だったが、家族や泰江が非国民呼ばわりされることを気に病んで、源治は自ら戦地に赴く。その結果、戦争が終わる約１ヶ月前に戦死するという皮肉な結末に至った。<br><br>
