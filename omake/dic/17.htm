時の蝋燭
</b></font></td></tr></table>
<table width=340 border=0 cellpadding=8><tr><td><font size=2>
特異な力を秘めた蝋燭で、これに火を灯している間だけ、その周囲の空間の時間を移動させる効力を持つ。<br><br>
今回ゲームに登場するのは、主人公の曽祖父が作った模造品であるらしいが、その能力は充分に発揮された。ただし調合が難しかったらしく、分量は非常に少ない。<br><br>
「時の杯」と共鳴させることにより、自分ではなく他の人間を時空移動させることが可能らしいが、その効力は長続きしないようだ。<br><br>
前作「時の館」「時の封土」においてもキーとなるアイテムであり、この「時の～」シリーズ全般を通しての真の主役（？）である。紫色をしていることが特徴の一つ。
