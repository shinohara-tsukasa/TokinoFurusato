賢者の杖
</b></font></td></tr></table>
<table width=340 border=0 cellpadding=8><tr><td><font size=2>
『西方の七賢者』の頭『導師ゲシュタル』の持ち物で、七賢者の宿敵である『時渡り』の一族に対する最終兵器。<br><br>
ちなみに『時渡り』とは、歴史上しばしば「吸血鬼」と呼ばれる特異能力を持つ一族のことで、時間を制御し歴史に多大な害を及ぼしてきた。『七賢者』は、彼らに対抗するために集められた能力者たちである。<br><br>
『時渡り』も『賢者』もこの物語には登場しないが、「賢者の杖」は前作「時の館」と「時の封土」に登場している。<br>
蔵の中でこの杖についての本が読めるが、はっきり言って今回の物語には何も関係ない。
</td></tr></table>
